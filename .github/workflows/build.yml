name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            line:
              - 'FSeaotterHime.Line/**'
              - 'FSeaotterHime/**'
            discord:
              - 'FSeaotterHime.Discord/**'
              - 'FSeaotterHime/**'

      - uses: actions/setup-dotnet@v4

      - name: Build Line
        if: steps.changes.outputs.line == 'true'
        run: dotnet build FSeaotterHime.Line/FSeaotterHime.Line.fsproj --configuration Release

      - name: Build Discord
        if: steps.changes.outputs.discord == 'true'
        run: dotnet build FSeaotterHime.Discord/FSeaotterHime.Discord.fsproj --configuration Release
