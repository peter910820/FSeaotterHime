name: Deploy

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to deploy
        required: true
        type: choice
        default: discord
        options:
          - discord
          - line

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DEPLOY_ROUTE: ${{ secrets.VPS_DEPLOY_ROUTE }}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for name in VPS_IP VPS_USERNAME VPS_SSH_KEY VPS_DEPLOY_ROUTE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  build:
    uses: ./.github/workflows/build.yml
    with:
      project: ${{ inputs.project }}

  deploy:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    env:
      BINARY_NAME: ${{ needs.build.outputs.binary_name }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: dist

      - name: Upload executable to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/*
          target: ${{ secrets.VPS_DEPLOY_ROUTE }}/
          strip_components: 1
          overwrite: true

      - name: Make executable
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: chmod u+x "${{ secrets.VPS_DEPLOY_ROUTE }}/${{ env.BINARY_NAME }}"

      - name: Show deployment info
        run: |
          echo "Deployed ref: ${{ github.ref }} (${{ github.sha }})"
          echo "Deployed to: ${{ secrets.VPS_DEPLOY_ROUTE }}/"